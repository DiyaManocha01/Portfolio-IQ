# Serves the built SPA with client-side routing fallback: any path that
# isn't a real static file falls back to index.html so React Router's
# BrowserRouter (not hash routing) handles it, instead of nginx 404ing on
# a deep link / page refresh (e.g. GET /portfolio/lab).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get a long cache lifetime; index.html itself is not
    # cached long so a new deploy is picked up promptly.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
