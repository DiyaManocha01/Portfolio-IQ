# Local/demo full-stack orchestration for PortfolioIQ.
#
# Quickstart:
#   cp .env.example .env                        # Compose-level vars (Postgres creds, VITE_API_BASE_URL)
#   cp backend/.env.example backend/.env         # backend/docker-entrypoint.sh needs this file to exist;
#                                                  # DATABASE_URL in it is overridden below, everything
#                                                  # else (SECRET_KEY, ANTHROPIC_API_KEY, ...) is read from it
#   docker compose up --build
#   # frontend: http://localhost:5173   backend: http://localhost:8000
#
# First boot runs Alembic migrations and seeds the demo user + synthetic
# data + trains the ML model (backend/docker-entrypoint.sh) -- this can
# take a minute or two; `docker compose logs -f backend` to watch it.
# See docs/DEPLOYMENT.md for the full picture, including what has and
# has not been verified by actually running this in this project's own
# development sandbox (network-restricted; see docs/limitations.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolioiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolioiq_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-portfolioiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolioiq} -d ${POSTGRES_DB:-portfolioiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's DATABASE_URL: inside Compose's network the
      # database is reachable at the service name `db`, not `localhost`.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-portfolioiq}:${POSTGRES_PASSWORD:-portfolioiq_dev_pw}@db:5432/${POSTGRES_DB:-portfolioiq}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persists trained model artifacts + market/news caches + the
      # entrypoint's seed marker across container restarts, so a restart
      # doesn't needlessly retrain the model or re-seed (see
      # backend/docker-entrypoint.sh). Removing this volume forces a
      # full reseed on next start.
      - backend_data:/app/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only (see frontend/Dockerfile) -- this is the URL
        # the USER'S BROWSER calls, so it must be reachable from the
        # host, not just from inside the Compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  backend_data:
